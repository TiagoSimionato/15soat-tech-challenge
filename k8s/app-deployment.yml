apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-15soat-tech-challenge
  labels:
    app: app-15soat-tech-challenge
  namespace: soat-grupo76
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-15soat-tech-challenge
  template:
    metadata:
      name: app-15soat-tech-challenge
      labels:
        app: app-15soat-tech-challenge
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-secrets
      containers:
        - name: c-15soat-tech-challenge
          image: ghcr.io/tiagosimionato/15soat-tech-challenge:tag
          resources:
            requests:
              cpu: 1
              memory: 100Mi
              ephemeral-storage: "2Gi"
            limits:
              cpu: 2
              memory: 100Mi
          ports:
            - containerPort: 3000
          livenessProbe:
            initialDelaySeconds: 10
            httpGet:
              port: 3000
              path: /health
          env:
          - name: DB_NAME
            valueFrom:
              secretKeyRef:
                name: secrets-15soat-tech-challenge
                key: POSTGRES_DB
          - name: DB_USER
            valueFrom:
              secretKeyRef:
                name: secrets-15soat-tech-challenge
                key: POSTGRES_USER
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: secrets-15soat-tech-challenge
                key: POSTGRES_PASSWORD
          - name: DB_HOST
            valueFrom:
              secretKeyRef:
                name: secrets-15soat-tech-challenge
                key: DB_HOST
          - name: DB_PORT
            valueFrom:
              secretKeyRef:
                name: secrets-15soat-tech-challenge
                key: DB_PORT
          - name: JWT_SECRET
            valueFrom:
              secretKeyRef:
                name: secrets-15soat-tech-challenge
                key: JWT_SECRET
