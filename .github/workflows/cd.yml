name: Build and Deploy project

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: self-hosted
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init and Apply
        env:
          TF_VAR_postgres_user:     ${{ secrets.DB_USER }}
          TF_VAR_postgres_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_postgres_db:       ${{ vars.DB_NAME }}
        run: terraform -chdir=infra init && terraform -chdir=infra apply -auto-approve

      - name: Load image into Kind
        run: |
          REPOSITORY=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          TAG=$(echo "${{ github.sha }}" | cut -c 1-7)
          docker pull ghcr.io/${REPOSITORY}:sha-${TAG}
          kind load docker-image ghcr.io/${REPOSITORY}:sha-${TAG} --name soat-cluster

      - name: Replace lastest deployment tag and update cluster
        run: |
          REPOSITORY=$(echo ${{ github.repository }} | sed -e 's/\(.*\)/\L\1/')
          TAG=$(echo ${{ github.sha }} | cut -c 1-7)
          sed -i "s|image: ghcr.io/${REPOSITORY}:.*|image: ghcr.io/${REPOSITORY}:sha-${TAG}|" k8s/deployment.yml
          kubectl apply -f k8s/deployment.yml
